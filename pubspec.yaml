name: your_eyes
description: "Your Eyes - Grocery and Currency Recognition App."
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ^3.10.3
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_tts: ^4.2.5
  speech_to_text: ^7.3.0
  vibration: ^2.0.0
  image_picker: ^1.0.7
  provider: ^6.1.5+1
  shared_preferences: ^2.5.4
  camera: ^0.10.5+2
  permission_handler: ^11.3.1
  intl: ^0.20.2
  path_provider: ^2.1.2
  image: ^4.1.3
  http: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^6.0.0

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  web:
    generate: true

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/

localization:
  arb-dir: lib/l10n
  template-arb-file: app_en.arb
  output-localization-file: app_localizations.dart
